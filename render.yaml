services:
  - type: web
    name: kirayasetu-rental-system
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: set MySQL credentials here or in Render Dashboard if using MySQL
      # - key: MYSQL_HOST
      #   sync: false
      # - key: MYSQL_USER
      #   sync: false
      # - key: MYSQL_PASSWORD
      #   sync: false
      # - key: MYSQL_DATABASE
      #   sync: false
